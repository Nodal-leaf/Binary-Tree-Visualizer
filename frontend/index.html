<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Tree Visualizer // Minimalist Neon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Minimalist Floating Control Bar -->
    <header class="control-bar">
        <!-- Tree Mode Toggle -->
        <div class="btn-group mode-group">
            <button id="mode-bst" class="btn mode-btn" data-mode="BST">BST</button>
            <button id="mode-avl" class="btn mode-btn active" data-mode="AVL">AVL</button>
        </div>

        <div class="divider"></div>

        <!-- Operations Group -->
        <div class="action-group">
            <input type="number" id="node-value-input" placeholder="Value" min="1" max="999" autocomplete="off">
            <button id="btn-insert" class="btn btn-primary" title="Insert Node">Insert</button>
            <button id="btn-delete" class="btn" title="Delete Node">Delete</button>
            <button id="btn-search" class="btn" title="Search Node">Search</button>
            <button id="btn-random-val" class="btn btn-icon" title="Random Value">🎲</button>
            <button id="btn-sample" class="btn" title="Load Sample Tree">Sample</button>
            <button id="btn-clear" class="btn btn-danger" title="Clear Tree">Clear</button>
        </div>

        <div class="divider"></div>

        <!-- Traversals -->
        <div class="btn-group traversal-group">
            <button class="btn traversal-btn" data-traversal="inorder" title="Inorder Traversal">Inorder</button>
            <button class="btn traversal-btn" data-traversal="preorder" title="Preorder Traversal">Preorder</button>
            <button class="btn traversal-btn" data-traversal="postorder" title="Postorder Traversal">Postorder</button>
        </div>

        <div class="divider"></div>

        <!-- Telemetry & Status -->
        <div class="stats-group">
            <span class="stat-pill">Nodes: <b id="stat-nodes">0</b></span>
            <span class="stat-pill">Height: <b id="stat-height">0</b></span>
            <span id="stat-status" class="status-dot online" title="Core Online">●</span>
        </div>
    </header>

    <!-- Fullscreen SVG Canvas Container -->
    <main id="svg-container">
        <svg id="tree-svg" width="100%" height="100%">
            <defs>
                <!-- Neon Green Glow Filters -->
                <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1" />
                    <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2" />
                    <feMerge>
                        <feMergeNode in="blur2" />
                        <feMergeNode in="blur1" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <filter id="edge-glow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur" />
                    <feMerge>
                        <feMergeNode in="blur" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <!-- Radial Gradients for Neon Nodes -->
                <radialGradient id="plasma-green" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#39ff14" stop-opacity="0.25" />
                    <stop offset="55%" stop-color="#00ff66" stop-opacity="0.1" />
                    <stop offset="100%" stop-color="#000000" stop-opacity="0.95" />
                </radialGradient>

                <radialGradient id="plasma-cyan" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#39ff14" stop-opacity="0.25" />
                    <stop offset="55%" stop-color="#00ff66" stop-opacity="0.1" />
                    <stop offset="100%" stop-color="#000000" stop-opacity="0.95" />
                </radialGradient>

                <radialGradient id="plasma-gold" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#ffff33" stop-opacity="0.35" />
                    <stop offset="60%" stop-color="#ffd700" stop-opacity="0.15" />
                    <stop offset="100%" stop-color="#000000" stop-opacity="0.95" />
                </radialGradient>

                <radialGradient id="plasma-purple" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#39ff14" stop-opacity="0.25" />
                    <stop offset="60%" stop-color="#00ff66" stop-opacity="0.1" />
                    <stop offset="100%" stop-color="#000000" stop-opacity="0.95" />
                </radialGradient>

                <radialGradient id="plasma-crimson" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#ff3366" stop-opacity="0.35" />
                    <stop offset="60%" stop-color="#ff0033" stop-opacity="0.15" />
                    <stop offset="100%" stop-color="#000000" stop-opacity="0.95" />
                </radialGradient>

                <linearGradient id="beam-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#00ff66" stop-opacity="0.9" />
                    <stop offset="100%" stop-color="#39ff14" stop-opacity="0.5" />
                </linearGradient>
            </defs>

            <!-- Transformed Viewport Layer -->
            <g id="viewport-group">
                <g id="edges-layer"></g>
                <g id="nodes-layer"></g>
                <g id="particles-layer"></g>
            </g>
        </svg>

        <!-- Minimal Empty State Prompt -->
        <div id="empty-state" class="empty-state hidden">
            <span class="empty-glow">✧</span>
            <p>Tree is empty. Insert a value or click Sample.</p>
        </div>
    </main>

    <!-- Floating Minimal Viewport Controls (Bottom-Right) -->
    <div class="viewport-controls">
        <button id="btn-zoom-in" class="ctrl-btn" title="Zoom In">+</button>
        <button id="btn-zoom-reset" class="ctrl-btn" title="Reset View">⛶</button>
        <button id="btn-zoom-out" class="ctrl-btn" title="Zoom Out">−</button>
    </div>

    <!-- Minimal Toast Notification for Rotations -->
    <div id="warp-banner" class="minimal-toast hidden">
        <span class="toast-badge">AVL REBALANCE</span>
        <div class="toast-text">
            <span id="warp-title" class="toast-title">RR ROTATION</span>
            <span id="warp-desc" class="toast-desc">Node 30 rotated</span>
        </div>
    </div>

    <!-- Minimal Floating Traversal Sequence Bar -->
    <div id="traversal-display" class="minimal-traversal-bar hidden">
        <span id="traversal-title" class="traversal-title">INORDER:</span>
        <div id="traversal-chips" class="traversal-chips"></div>
        <button id="btn-close-traversal" class="close-btn" title="Close">✕</button>
    </div>

    <!-- Minimal Node Details Card (Bottom-Left popup when node is clicked) -->
    <div id="selected-node-card" class="minimal-node-card hidden"></div>

    <!-- Hidden compatibility elements required by app.js -->
    <div style="display:none;" aria-hidden="true">
        <div id="mission-log"></div>
        <button id="btn-clear-log"></button>
        <input type="range" id="speed-slider" value="1.0">
        <span id="speed-display">1.0x</span>
        <input type="checkbox" id="audio-toggle" checked>
    </div>

    <!-- Scripts -->
    <script src="tree-visualizer.js"></script>
    <script src="app.js"></script>
</body>
</html>
